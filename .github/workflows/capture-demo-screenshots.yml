name: Capture live demo screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/capture-demo-screenshots.yml"
      - "scripts/capture-demo-screenshots.js"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          mkdir -p /tmp/shift-planning-pw
          npm --prefix /tmp/shift-planning-pw init -y
          npm --prefix /tmp/shift-planning-pw install playwright@1.56.1
          npx --prefix /tmp/shift-planning-pw playwright install --with-deps chromium

      - name: Capture production screenshots
        env:
          DEMO_URL: https://shift-planning-system-drab.vercel.app/takvim
          NODE_PATH: /tmp/shift-planning-pw/node_modules
        run: |
          mkdir -p assets/screenshots
          node scripts/capture-demo-screenshots.js

      - name: Commit refreshed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/login-clean-desktop.png assets/screenshots/takvim-desktop.png assets/screenshots/takvim-mobile.png
          if git diff --cached --quiet; then
            echo "Screenshots are unchanged."
          else
            git commit -m "docs: refresh live demo screenshots"
            git push
          fi
